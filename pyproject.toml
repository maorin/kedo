[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kedo"
version = "0.1.0"
description = "kedo — AI 开发助手：从需求到部署的全流程自动化"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "websockets>=12.0",
    "httpx>=0.25.0",
    "anthropic>=0.39.0",
    "openai>=1.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0", "pytest-asyncio>=0.23.0", "pytest-cov>=4.1.0"]

[project.scripts]
kedo = "kedo:main"

[tool.setuptools]
py-modules = ["kedo"]

[tool.setuptools.packages.find]
include = ["cli*", "core*", "api*", "tools*", "pipeline*", "dashboard*"]
