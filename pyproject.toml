[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kedo"
version = "0.1.0"
description = "从需求到部署的全流程自动化开发工具"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "click>=8.1",
    "openai>=1.0",
    "rich>=13.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-mock>=3.12",
]

[project.scripts]
kedo = "kedo.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["kedo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_classes = ["Test*"]
filterwarnings = ["ignore::pytest.PytestCollectionWarning"]
